<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rak Buku - Prototipe Login</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 16px; max-width: 480px; }
  button, input { font: inherit; margin: 4px 0; padding: 10px; }
  button { display: block; width: 100%; }
  pre { background: #eee; padding: 8px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h1>Prototipe login</h1>
<p>Mode standalone: <b id="standalone">?</b></p>
<p>Status login: <b id="status">belum login</b></p>
<button id="login">Login Google</button>
<button id="token">Ambil token</button>
<input type="file" id="file" accept="application/pdf">
<button id="upload">Upload ke Drive</button>
<pre id="log"></pre>
<script>
const WORKER_URL = 'https://rak-buku-auth.USERNAME.workers.dev';
const $ = (id) => document.getElementById(id);
const log = (m) => { $('log').textContent = m + '\n' + $('log').textContent; };
const KEY = 'spike-auth';
let accessToken = null;

const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
$('standalone').textContent = standalone ? 'ya' : 'tidak';

// Hanya untuk prototipe: blob disimpan di localStorage.
const h = location.hash;
if (h.startsWith('#auth=')) {
  localStorage.setItem(KEY, h.slice(6));
  history.replaceState(null, '', location.pathname + location.search);
  log('Login berhasil, blob tersimpan.');
} else if (h.startsWith('#auth-error=')) {
  let m = h.slice(12);
  try { m = decodeURIComponent(m); } catch { m = 'pesan error tidak terbaca (' + m + ')'; }
  log('Login gagal: ' + m);
  history.replaceState(null, '', location.pathname + location.search);
}
const refreshStatus = () => { $('status').textContent = localStorage.getItem(KEY) ? 'sudah login (blob ada)' : 'belum login'; };
refreshStatus();

$('login').onclick = () => { location.href = WORKER_URL + '/login'; };

async function getToken() {
  const blob = localStorage.getItem(KEY);
  if (!blob) throw new Error('Belum login.');
  const r = await fetch(WORKER_URL + '/token', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ blob }),
  });
  const d = await r.json();
  if (!r.ok) throw new Error('Token gagal: ' + (d.error || r.status));
  accessToken = d.access_token;
  return d.expires_in;
}

$('token').onclick = async () => {
  try { log('Token didapat, berlaku ' + (await getToken()) + ' detik.'); }
  catch (e) { log(e.message); }
};

$('upload').onclick = async () => {
  try {
    const f = $('file').files[0];
    if (!f) throw new Error('Pilih file PDF dulu.');
    await getToken();
    const body = new FormData();
    body.append('metadata', new Blob([JSON.stringify({ name: f.name })], { type: 'application/json' }));
    body.append('file', f);
    const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: { authorization: 'Bearer ' + accessToken },
      body,
    });
    const d = await r.json();
    if (!r.ok) throw new Error('Upload gagal: ' + JSON.stringify(d.error || d));
    log('Upload berhasil, id file: ' + d.id);
  } catch (e) { log(e.message); }
};
</script>
</body>
</html>
